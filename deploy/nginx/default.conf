# Proxy inverso de FitConnect.
# Nginx es el unico servicio expuesto al exterior (puerto 80). El backend
# (Kestrel, contenedor "api" en el puerto 8080) NO se expone directamente:
# solo es alcanzable por la red interna de Docker a traves de este proxy.
server {
    listen 80;
    server_name _;

    # Sube el limite para las fotos de clientes en base64.
    client_max_body_size 10m;

    location / {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
